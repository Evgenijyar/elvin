; Production direct-SIP route selected per robot assignment.
; AMI first originates the customer PJSIP channel. Only after that channel is
; accepted does this context bridge it to the existing Elvin WebSocket/Gemini
; media runtime.
[elvin-direct-outbound]
exten => s,1,NoOp(Elvin direct outbound call ${ELVIN_DIRECT_CALL_ID})
 same => n,Set(CHANNEL(language)=ru)
 same => n,UserEvent(ElvinDirectCall,DirectCallId:${ELVIN_DIRECT_CALL_ID},Stage:MEDIA_BRIDGE_STARTED,Channel:${CHANNEL(name)},Uniqueid:${UNIQUEID})
 same => n,Dial(WebSocket/elvin-media/c(slin16)f(json))
 same => n,UserEvent(ElvinDirectCall,DirectCallId:${ELVIN_DIRECT_CALL_ID},Stage:MEDIA_BRIDGE_FINISHED,MediaDialStatus:${DIALSTATUS},Channel:${CHANNEL(name)},Uniqueid:${UNIQUEID})
 same => n,Hangup()
