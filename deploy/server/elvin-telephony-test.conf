; Isolated direct-SIP playback test.
; This context is entered only by the authenticated Elvin AMI Originate action.
; It does not share the production LPTracker -> Gemini/WebSocket dialplan.
[elvin-telephony-test]
exten => s,1,NoOp(Elvin isolated telephony test ${ELVIN_TEST_ID})
 same => n,Set(CHANNEL(language)=ru)
 same => n,UserEvent(ElvinTelephonyTest,TestId:${ELVIN_TEST_ID},Stage:ANSWERED,Channel:${CHANNEL(name)},Uniqueid:${UNIQUEID})
 same => n,UserEvent(ElvinTelephonyTest,TestId:${ELVIN_TEST_ID},Stage:PLAYBACK_STARTED,Channel:${CHANNEL(name)},Uniqueid:${UNIQUEID})
 same => n,Playback(/var/lib/asterisk/sounds/elvin-telephony-test/${ELVIN_TEST_ID})
 same => n,UserEvent(ElvinTelephonyTest,TestId:${ELVIN_TEST_ID},Stage:PLAYBACK_FINISHED,PlaybackStatus:${PLAYBACKSTATUS},Channel:${CHANNEL(name)},Uniqueid:${UNIQUEID})
 same => n,Hangup()
